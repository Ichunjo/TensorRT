name: Compile TensorRT RTX Bindings

on:
  push:
    branches:
      - rtx
    paths:
      - "python/**"
      - ".github/workflows/build-wheels.yml"
      - ".github/actions/**"
      - "*.ps1"
      - "VERSION_RTX"
    tags:
      - "rtx-v*"
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/build-wheels.yml"
      - ".github/actions/**"
      - "*.ps1"
      - "VERSION_RTX"
  workflow_dispatch:

env:
  CUDA_MAJOR: "13"
  CUDA_WINDOWS_VERSION: "13.2.1"
  CUDA_LINUX_x86_64_VERSION: "13.2"
  BUILD_RTX: "1"

jobs:
  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            cuda_repo: rhel8/x86_64
            container: quay.io/pypa/manylinux_2_28_x86_64
          - name: Windows x64
            os: windows-2025-vs2026

    name: Build wheels on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install PowerShell (Linux)
        if: runner.os == 'Linux'
        run: |
          # Install PowerShell Core
          curl -s https://packages.microsoft.com/config/rhel/8/prod.repo | tee /etc/yum.repos.d/microsoft.repo
          dnf install -y powershell

      - name: Resolve versions from VERSION file
        shell: pwsh
        run: |
          $v = (Get-Content VERSION_RTX -Raw).Trim()
          $p = $v.Split(".")
          $trtVersion = "$($p[0]).$($p[1]).$($p[2])"
          "TRT_VERSION=$trtVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TRT_PY_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TRT_MAJOR=$($p[0])" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TRT_MINOR=$($p[1])" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TENSORRT_WINDOWS_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TENSORRT_LINUX_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"

      - name: Setup CUDA (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-cuda-windows
        with:
          cuda-version: ${{ env.CUDA_WINDOWS_VERSION }}
          cuda-components: "nvcc, cudart, cuda_profiler_api, crt, nvptxcompiler"
          cache-key: ${{ matrix.os }}

      - name: Setup TensorRT (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-tensorrt-rtx-windows
        with:
          tensorrt-rtx-version: ${{ env.TENSORRT_WINDOWS_VERSION }}
          cuda-version: ${{ env.CUDA_WINDOWS_VERSION }}

      - name: Setup CUDA & TensorRT (Linux x64)
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-tensorrt-rtx-linux-x86-64
        with:
          tensorrt-rtx-version: ${{ env.TENSORRT_LINUX_VERSION }}
          cuda-repo: ${{ matrix.cuda_repo }}
          cuda-version: ${{ env.CUDA_LINUX_x86_64_VERSION }}
          cuda-components: "cuda-nvcc, cuda-cudart-devel, cuda-driver-devel, cuda-profiler-api"

      - name: Compile and Build Wheels
        shell: pwsh
        run: ./reproduce_build.ps1
        env:
          TRT_SDK_DIR: ${{ env.TENSORRT_PATH }}

      - name: Repair Wheels (Linux)
        if: runner.os == 'Linux'
        run: |
          uvx --with patchelf auditwheel repair \
            --allow-pure-python-wheel \
            --exclude libtensorrt_onnxparser_rtx.so.* \
            --exclude libtensorrt_rtx.so.* \
            --strip python/build/dist/*.whl \
            -w repaired_wheels
          rm python/build/dist/*.whl
          mv repaired_wheels/*.whl python/build/dist/

      - name: Upload Bindings Wheels
        uses: actions/upload-artifact@v7
        with:
          name: tensorrt-rtx-bindings-wheel-cuda-${{ env.CUDA_MAJOR }}-${{ matrix.name }}
          path: python/build/dist/tensorrt_rtx_cu${{ env.CUDA_MAJOR }}_bindings-*.whl

      # - name: Upload Libs Wheels
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: tensorrt-rtx-libs-wheel-cuda-${{ env.CUDA_MAJOR }}-${{ matrix.name }}
      #     path: python/build/dist/tensorrt_rtx_cu${{ env.CUDA_MAJOR }}_libs-*.whl

      # - name: Upload Frontend Wheels
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: tensorrt-rtx-frontend-wheel-cuda-${{ env.CUDA_MAJOR }}-${{ matrix.name }}
      #     path: |
      #       python/build/dist/tensorrt_rtx_cu${{ env.CUDA_MAJOR }}-*.whl
      #       python/build/dist/tensorrt_rtx_cu${{ env.CUDA_MAJOR }}-*.tar.gz

  publish:
    name: Publish to vs-wheels
    needs: build-wheels
    if: startsWith(github.ref, 'refs/tags/rtx-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: VERSION_RTX
          sparse-checkout-cone-mode: false

      - name: Resolve versions from VERSION file
        shell: bash
        run: |
          v=$(cat VERSION_RTX | tr -d '[:space:]')
          echo "TRT_PY_VERSION=$v" >> "$GITHUB_ENV"

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Determine version
        id: version
        run: |
          TAG="tensorrt-rtx-cu${{ env.CUDA_MAJOR }}_bindings-${{ env.TRT_PY_VERSION }}"
          echo "version=${{ env.TRT_PY_VERSION }}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          repository: Jaded-Encoding-Thaumaturgy/vs-wheels
          token: ${{ secrets.VS_WHEELS_RELEASE_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: tensorrt-rtx-cu${{ env.CUDA_MAJOR }}_bindings-${{ steps.version.outputs.version }}
          files: dist/*
          body: tensorrt-rtx-cu${{ env.CUDA_MAJOR }}_bindings-${{ steps.version.outputs.version }}
          fail_on_unmatched_files: true
          generate_release_notes: false
